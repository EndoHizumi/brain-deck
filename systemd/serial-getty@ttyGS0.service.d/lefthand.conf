# Brain のシリアルコンソール（/dev/ttyGS0。PC 側では 1 つ目の ACM）の getty の drop-in。
# getty そのものは Brainux（systemd）の serial-getty@.service をそのまま使い、ここでは次の 3 つだけを変える。
# 有効にするのは console-setup.sh（enable と、ttyGS0 ができたときに起動する Wants）。
# 元に戻すには sudo sh console-setup.sh off。
[Service]
# 既定は vt220（色が出ない、一部のキーが効かない）。設定 GUI のコンソールのタブ（xterm.js）に合わせる
Environment=TERM=xterm-256color
# getty が起動したときに何も書かない。PC がポートを開いていないあいだに書いたもの（systemd の端末のリセットと
# 大きさの問い合わせ、ログイン画面）は USB の送信待ちに残り、あとで PC がポートを開いた瞬間に届く。PC の tty が
# 生のモードになる前（エコーがオン）だと、それが Brain に送り返され、getty がユーザー名として読む
# （ログインの失敗が残る。設定 GUI の Chromium でも起きた）。そこで、systemd のリセットをやめ（TTYReset=no）、
# agetty は Enter が届くまでログイン画面を出さない（--wait-cr）。設定 GUI のコンソールのタブでは Enter を押す
TTYReset=no
ExecStart=
ExecStart=-/sbin/agetty -o '-- \\u' --noreset --noclear --wait-cr --keep-baud 115200,57600,38400,9600 - ${TERM}

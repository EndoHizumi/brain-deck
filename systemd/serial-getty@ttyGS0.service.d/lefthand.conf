# Brain のシリアルコンソール（/dev/ttyGS0。PC 側では 1 つ目の ACM）の getty の drop-in。
# getty そのものは Brainux（systemd）の serial-getty@.service をそのまま使い、ここでは端末の種類だけを変える。
# 有効にするのは console-setup.sh（enable と、ttyGS0 ができたときに起動する Wants）。
# 元に戻すには sudo sh console-setup.sh off。
[Service]
# 既定は vt220（色が出ない、一部のキーが効かない）。設定 GUI のコンソールのタブ（xterm.js）に合わせる
Environment=TERM=xterm-256color

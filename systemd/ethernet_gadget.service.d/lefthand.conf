# Brainux の ethernet_gadget.service を上書きする drop-in。
# 標準の enable_ethernet_gadget は最後に dhclient を実行し、PC 側に DHCP サーバーが
# 無いため約 77 秒ブロックする。代わりに lefthand-gadget-setup で
# NCM + HID + ACM のガジェットを作り、usb0 に固定 IP を付ける。
# 元に戻すには、このファイルを消して systemctl daemon-reload する。
[Service]
ExecStart=
ExecStart=/usr/local/sbin/lefthand-gadget-setup
# 何度実行してもよいスクリプトなので、完了後は active のままにする
RemainAfterExit=yes

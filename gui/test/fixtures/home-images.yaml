# gui/test/fixtures/home-images.yaml（テスト用。config/pda-example.yaml に、壁紙と画像のアイコンのホーム画面、帯の項目、portrait_grid: stretch を書いたもの）
# 「PC のための手元の PDA」の例。ホーム画面（home）に、今のダッシュボードや道具をアプリとして並べる。
# config/gadgets-example.yaml に、月、天気、電卓、グラフ、マウス、発表のレイヤー（それぞれの例の設定から）と、
# 「メモ」「端末」「本体」のレイヤー、ホーム画面、状態の帯（status_bar）、縦向きの格子（touch_portrait）を足したもの。
# 起動するとホーム画面が出る。アイコンをタップするとそのレイヤーに入り、画面右の帯の HOME でホーム画面に戻る。
# 左手デバイス（base）も、ホーム画面のアプリの 1 つ（「左手」）。書き方は docs/config.md の「ホーム画面」「状態の帯」「画面の回転」
hid_device: /dev/hidg0
keyboard: brain-kbd-i2c
touch:
  device: mxs-lradc-ts
  min_x: 226
  max_x: 3938
  min_y: 3803
  max_y: 384
  soft_areas:
    back: {x: [3740, 4095], "y": [812, 1239]}
    down: {x: [3740, 4095], "y": [2522, 2948]}
    enter: {x: [3740, 4095], "y": [1240, 1666]}
    home: {x: [3740, 4095], "y": [3377, 4095]}
    left: {x: [3740, 4095], "y": [1667, 2094]}
    menu: {x: [3740, 4095], "y": [0, 811]}
    right: {x: [3740, 4095], "y": [2095, 2521]}
    up: {x: [3740, 4095], "y": [2949, 3376]}
layers:
  - name: base
    label: 基本
    # 左手デバイスの画面は、格子を広く使うため状態の帯を出さない
    status_bar: false
    keys:
      KEY_0: "0"
      KEY_1: "1"
      KEY_2: "2"
      KEY_3: "3"
      KEY_4: "4"
      KEY_5: "5"
      KEY_6: "6"
      KEY_7: "7"
      KEY_8: "8"
      KEY_9: "9"
      KEY_A: A
      KEY_APOSTROPHE: APOSTROPHE
      KEY_B: B
      KEY_BACKSLASH: BACKSLASH
      KEY_BACKSPACE: BACKSPACE
      KEY_C: C
      KEY_COMMA: COMMA
      KEY_D: D
      KEY_DELETE: DELETE
      KEY_DOT: DOT
      KEY_DOWN: DOWN
      KEY_E: E
      KEY_ENTER: ENTER
      KEY_EQUAL: EQUAL
      KEY_ESC: ESC
      KEY_F: F
      KEY_G: G
      KEY_GRAVE: GRAVE
      KEY_H: H
      KEY_I: I
      KEY_INSERT: INSERT
      KEY_J: J
      KEY_K: K
      KEY_L: L
      KEY_LEFT: LEFT
      KEY_LEFTALT: LALT
      KEY_LEFTBRACE: LEFTBRACE
      KEY_LEFTCTRL: LCTRL
      KEY_LEFTSHIFT: LSHIFT
      KEY_M: M
      KEY_MINUS: MINUS
      KEY_N: "N"
      KEY_O: O
      KEY_P: P
      KEY_PAGEDOWN: PAGEDOWN
      KEY_PAGEUP: PAGEUP
      KEY_Q: Q
      KEY_R: R
      KEY_RIGHT: RIGHT
      KEY_RIGHTBRACE: RIGHTBRACE
      KEY_S: S
      KEY_SEMICOLON: SEMICOLON
      KEY_SLASH: SLASH
      KEY_SPACE: SPACE
      KEY_T: T
      KEY_TAB: TAB
      KEY_U: U
      KEY_UP: UP
      KEY_V: V
      KEY_W: W
      KEY_X: X
      KEY_Y: "Y"
      KEY_Z: Z
    touch:
      cols: 4
      rows: 3
      cells:
        "0,0": {key: LGUI+S, label: 保存}
        "0,1": {key: LGUI+C, label: コピー}
        "0,2": {layer_toggle: menu, label: メニュー}
        "1,0": {key: LGUI+Z, label: 取り消し}
        "1,1": {key: LGUI+V, label: 貼り付け}
        "1,2": {key: LGUI, label: "Cmd\n押す間"}
        "2,0": {key: LGUI+LSHIFT+Z, label: やり直し}
        "2,1": {key: LGUI+X, label: 切り取り}
        "2,2": {key: LGUI+TAB, label: "アプリ\n切替"}
        "3,0": {key: LGUI+F, label: 検索}
        "3,1": {key: LGUI+A, label: 全選択}
        "3,2": {key: LGUI+SPACE, label: Spotlight}
    soft_keys:
      back: LGUI
      down: {layer_toggle: browser}
      enter: {layer_toggle: symbol}
      left: {layer_toggle: move}
      menu: {layer_toggle: menu}
      right: {layer_toggle: debug}
      up: {layer_toggle: code}
  - name: menu
    label: メニュー
    touch:
      cols: 4
      rows: 3
      cells:
        "0,2": {layer_to: todo, label: Todo}
        "1,2": {layer_to: calendar, label: 予定}
        "0,0": {layer_to: code, label: コード}
        "0,1": {layer_to: symbol, label: 記号}
        "1,0": {layer_to: browser, label: ブラウザ}
        "1,1": {layer_to: window, label: ウィンドウ}
        "2,0": {layer_to: debug, label: デバッグ}
        "2,1": {layer_to: info, label: 情報}
        "3,0": {layer_to: move, label: 移動}
        "3,1": {layer_to: base, label: 基本}
        "2,2": {layer_to: tools, label: 道具}
        "3,2": {layer_to: share, label: 共有}
  - name: code
    label: コード
    touch:
      cols: 4
      rows: 3
      cells:
        "0,0": {key: LGUI+LSHIFT+P, label: "コマンド\nパレット"}
        "0,1": {key: F12, label: 定義へ}
        "0,2": {key: LSHIFT+LALT+F, label: 整形}
        "1,0": {key: LGUI+P, label: "ファイル\nを開く"}
        "1,1": {key: LSHIFT+F12, label: 参照}
        "1,2": {key: LGUI+SLASH, label: コメント}
        "2,0": {key: LGUI+LSHIFT+F, label: "全体を\n検索"}
        "2,1": {key: LCTRL+MINUS, label: "前の\n位置へ"}
        "2,2": {key: LGUI+D, label: "次の一致\nも選択"}
        "3,0": {key: LGUI+B, label: "サイド\nバー"}
        "3,1": {key: F2, label: "名前の\n変更"}
        "3,2": {key: LGUI+DOT, label: "クイック\n修正"}
  - name: browser
    label: ブラウザ
    touch:
      cols: 4
      rows: 3
      cells:
        "0,0": {key: LGUI+LALT+I, label: "開発\nツール"}
        "0,1": {key: LGUI+R, label: "再読み\n込み"}
        "0,2": {key: LCTRL+LSHIFT+TAB, label: "前の\nタブ"}
        "1,0": {key: LGUI+LSHIFT+C, label: "要素を\n選択"}
        "1,1": {key: LGUI+LSHIFT+R, label: "強制\n再読込"}
        "1,2": {key: LCTRL+TAB, label: "次の\nタブ"}
        "2,0": {key: LGUI+LALT+K, label: "コン\nソール"}
        "2,1": {key: LGUI+L, label: "アドレス\nバー"}
        "2,2": {key: LGUI+EQUAL, label: 拡大}
        "3,0": {key: LGUI+LALT+M, label: "レスポン\nシブ"}
        "3,1": {key: LGUI+LSHIFT+T, label: "閉じた\nタブ"}
        "3,2": {key: LGUI+MINUS, label: 縮小}
  - name: debug
    label: デバッグ
    touch:
      cols: 4
      rows: 3
      cells:
        "0,0": {key: F5, label: "開始\n続行"}
        "0,1": {key: F9, label: "ブレーク\nポイント"}
        "0,2": {key: F8, label: "FF\n再開"}
        "1,0": {key: F10, label: "ステップ\nオーバー"}
        "1,1": {key: LSHIFT+F5, label: 停止}
        "1,2": {key: LGUI+B, label: "FF\nブレーク"}
        "2,0": {key: F11, label: "ステップ\nイン"}
        "2,1": {key: LGUI+LSHIFT+F5, label: 再起動}
        "2,2": {key: LGUI+LSHIFT+B, label: "FF条件付\nブレーク"}
        "3,0": {key: LSHIFT+F11, label: "ステップ\nアウト"}
        "3,1": {key: LGUI+LSHIFT+D, label: "実行と\nデバッグ"}
        "3,2": {key: LGUI+LALT+Z, label: "FF\nデバッガ"}
  - name: move
    label: 移動
    keys:
      KEY_A: LGUI+LEFT
      KEY_B: LALT+LEFT
      KEY_D: PAGEDOWN
      KEY_E: LGUI+RIGHT
      KEY_H: LEFT
      KEY_I: LGUI+UP
      KEY_J: DOWN
      KEY_K: UP
      KEY_L: RIGHT
      KEY_M: LGUI+DOWN
      KEY_U: PAGEUP
      KEY_W: LALT+RIGHT
    touch:
      cols: 4
      rows: 3
      cells:
        "0,0": {key: LALT+LEFT, label: "単語←\n(B)"}
        "0,1": {key: LEFT, label: "←\n(H)"}
        "0,2": {key: LGUI+LEFT, label: "行頭\n(A)"}
        "1,0": {key: UP, label: "↑\n(K)"}
        "1,1": {key: DOWN, label: "↓\n(J)"}
        "1,2": {key: PAGEUP, label: "PgUp\n(U)"}
        "2,0": {key: LALT+RIGHT, label: "単語→\n(W)"}
        "2,1": {key: RIGHT, label: "→\n(L)"}
        "2,2": {key: PAGEDOWN, label: "PgDn\n(D)"}
        "3,0": {key: LGUI+UP, label: "先頭\n(I)"}
        "3,1": {key: LGUI+DOWN, label: "末尾\n(M)"}
        "3,2": {key: LGUI+RIGHT, label: "行末\n(E)"}
  - name: symbol
    label: 記号
    touch:
      cols: 5
      rows: 4
      cells:
        "0,0": {key: LSHIFT+9, label: (}
        "0,1": {key: LSHIFT+DOT, label: '>'}
        "0,2": {key: LSHIFT+1, label: '!'}
        "0,3": {key: LSHIFT+6, label: ^}
        "1,0": {key: LSHIFT+0, label: )}
        "1,1": {key: LSHIFT+APOSTROPHE, label: '"'}
        "1,2": {key: LSHIFT+2, label: '@'}
        "1,3": {key: LSHIFT+7, label: '&'}
        "2,0": {key: LSHIFT+LEFTBRACE, label: '{'}
        "2,1": {key: LSHIFT+SEMICOLON, label: ':'}
        "2,2": {key: LSHIFT+3, label: '#'}
        "2,3": {key: LSHIFT+8, label: '*'}
        "3,0": {key: LSHIFT+RIGHTBRACE, label: '}'}
        "3,1": {key: LSHIFT+BACKSLASH, label: '|'}
        "3,2": {key: LSHIFT+4, label: $}
        "3,3": {key: LSHIFT+EQUAL, label: +}
        "4,0": {key: LSHIFT+COMMA, label: <}
        "4,1": {key: LSHIFT+MINUS, label: _}
        "4,2": {key: LSHIFT+5, label: '%'}
        "4,3": {key: LSHIFT+SLASH, label: '?'}
  - name: window
    label: ウィンドウ
    touch:
      cols: 4
      rows: 3
      cells:
        "0,0": {key: LGUI+TAB, label: "アプリ\n切替"}
        "0,1": {key: LCTRL+LEFT, label: "左の\nスペース"}
        "0,2": {key: LGUI+M, label: しまう}
        "1,0": {key: LGUI+GRAVE, label: "同じアプリ\nの次"}
        "1,1": {key: LCTRL+RIGHT, label: "右の\nスペース"}
        "1,2": {key: LGUI+H, label: 隠す}
        "2,0": {key: LCTRL+UP, label: "Mission\nControl"}
        "2,1": {key: LCTRL+LGUI+F, label: "フル\nスクリーン"}
        "2,2": {key: LGUI+W, label: 閉じる}
        "3,0": {key: LCTRL+DOWN, label: "アプリの\nウィンドウ"}
        "3,1": {key: LGUI+LSHIFT+5, label: "スクリーン\nショット"}
        "3,2": {key: LGUI+SPACE, label: Spotlight}
  - name: info
    label: 情報
    touch:
      cols: 4
      rows: 3
      cells:
        # 大きな時計（2 列 × 2 行ぶん）。タップしても何もしない
        "0,0": {widget: clock, span: [2, 2]}
        # 秒まで出す時計。1 秒ごとに描き直す
        "2,0": {widget: clock, format: "15:04:05", date_format: "Jan 2 Mon", label: 秒}
        # ほかのタイムゾーン。タップするとキーを送る
        "3,0": {widget: clock, tz: America/Los_Angeles, date_format: "1/2 {wday}", label: LA, key: LGUI+SPACE}
        # テキストのタイル。中身は PC から `brain-deck text build "ビルド成功" --style ok` で書き換える
        "2,1": {widget: text, id: build, label: ビルド}
        # タップするとキーを送るテキストのタイル
        "3,1": {widget: text, id: deploy, label: デプロイ, key: LGUI+S}
        # span はキーのセルにも使える
        "0,2": {key: ENTER, span: [3, 1], label: 決定}
        "3,2": {layer_to: base, label: 基本}
  - name: todo
    label: Todo
    touch:
      cols: 4
      rows: 3
      cells:
        # Todo の一覧（2 列 × 3 行ぶん）。項目を 0.5 秒押し続けると完了を切り替える。
        # 入りきらないときは、下の ▲ ▼ でページを送る。項目は設定 GUI の「Todo」タブか、
        # PC で `brain-deck todo add "牛乳を買う"` で足す
        "0,0": {widget: todo, span: [2, 3], label: Todo}
        "2,0": {widget: clock, span: [2, 1]}
        "2,1": {widget: text, id: build, label: ビルド}
        "3,1": {widget: text, id: deploy, label: デプロイ}
        "2,2": {layer_to: menu, label: メニュー}
        "3,2": {layer_to: base, label: 基本}
  - name: calendar
    label: 予定
    touch:
      cols: 4
      rows: 3
      cells:
        # 今日の予定と次の予定（2 列 × 3 行ぶん）。今の予定は行を塗り、終わった予定は薄く出す。
        # 入りきらないときは、下の ▲ ▼ でページを送る（1 分触らなければ、今の予定のページに戻る）。
        # 予定は PC で `brain-deck calendar sync` を実行して送る（README の「カレンダー」）
        "0,0": {widget: calendar, span: [2, 3], label: 予定}
        "2,0": {widget: clock, span: [2, 1]}
        # calendars で、出すカレンダーを選べる（brain-deck の calendars.yaml の name）
        "2,1": {widget: calendar, span: [2, 1], calendars: [家], label: 家}
        "2,2": {layer_to: menu, label: メニュー}
        "3,2": {layer_to: base, label: 基本}
    # 縦向きの格子。予定を縦に長く
    touch_portrait:
      cols: 2
      rows: 4
      cells:
        "0,0": {widget: clock, span: [2, 1]}
        "0,1": {widget: calendar, span: [2, 3], label: 予定}
  - name: tools
    label: 道具
    touch:
      cols: 4
      rows: 3
      cells:
        # ストップウォッチ。タップで開始と停止、0.5 秒押し続けると 0 に戻す
        "0,0": {widget: stopwatch, span: [2, 1], label: ストップウォッチ}
        # 電池の残りと、USB から給電しているか
        "2,0": {widget: battery, label: 電池}
        # カウンター。タップで +1、0.5 秒押し続けると 0 に戻す。値は Brain を再起動しても残る
        "3,0": {widget: counter, label: カウンター}
        # ポモドーロ。タップで開始と一時停止、0.5 秒押し続けると最初に戻す。作業と休憩が切り替わると 15 秒点滅する
        "0,1": {widget: pomodoro, span: [2, 2], work: 25m, break: 5m, label: ポモドーロ}
        # id を変えると、別のカウンターになる
        "2,1": {widget: counter, id: coffee, label: コーヒー}
        # 在席ランプの状態は自由に決められる（名前と色）
        "3,1": {widget: presence, id: door, states: [{name: 在室, color: "#40c070"}, {name: 不在, color: "#606870"}]}
        "2,2": {layer_to: menu, label: メニュー}
        "3,2": {layer_to: base, label: 基本}
    # 縦向きの格子。ストップウォッチを上に、ポモドーロを大きく
    touch_portrait:
      cols: 2
      rows: 4
      cells:
        "0,0": {widget: stopwatch, span: [2, 1], label: ストップウォッチ}
        "0,1": {widget: pomodoro, span: [2, 2], work: 25m, break: 5m, label: ポモドーロ}
        "0,3": {widget: counter, label: カウンター}
        "1,3": {widget: battery, label: 電池}
  - name: share
    label: 共有
    touch:
      cols: 4
      rows: 3
      cells:
        # QR コード。中身は PC から `brain-deck qr share "https://..."` で送る
        "0,0": {widget: qr, id: share, span: [2, 3], label: 共有}
        # 在席ランプ。タップで次の状態、0.5 秒押し続けると前の状態。PC から `brain-deck presence 会議中` でも変えられる。
        # states を書かなければ、在席、集中、会議中、休憩
        "2,0": {widget: presence, span: [2, 2]}
        "2,2": {layer_to: menu, label: メニュー}
        "3,2": {layer_to: base, label: 基本}
  - name: month
    label: 月
    touch:
      cols: 4
      rows: 3
      cells:
        # 月の表示（2 列 × 2 行ぶん）。▲▼ で前の月と次の月、日付をタップでその日を選ぶ。帯の中央をタップすると今月に戻る。
        # 1 分触らなければ、今月と今日に戻る（page_reset）。土曜は青、日曜と祝日は赤、予定のある日には点
        "0,0": {widget: month, id: cal, span: [2, 2]}
        # follow: cal で、上の月の表示で選んだ日の予定を出す（選んでいなければ、今日の予定と次の予定）
        "2,0": {widget: calendar, follow: cal, span: [2, 2], label: 予定}
        "0,2": {widget: clock, span: [2, 1]}
        "2,2": {layer_to: menu, label: メニュー}
        "3,2": {layer_to: base, label: 基本}
  - name: weather
    label: 天気
    touch:
      cols: 4
      rows: 3
      cells:
        # 2 列 × 2 行：今日と明日を並べ、アイコンの下に天気と気温、下に 6 時間ごとの降水確率（時間帯の見出しつき）
        "0,0": {widget: weather, span: [2, 2]}
        # 2 列 × 1 行：今日と明日。アイコンの右に天気と気温、下に降水確率
        "2,0": {widget: weather, span: [2, 1]}
        # 1 × 1：今日だけ。見出し（label）を付けると、そのぶん降水確率が出なくなる
        "2,1": {widget: weather, label: 天気, stale: 2h}
        "3,1": {widget: clock}
        "0,2": {widget: calendar, span: [2, 1]}
        "2,2": {layer_to: menu, label: メニュー}
        "3,2": {layer_to: base, label: 基本}
  - name: calc
    label: 電卓
    touch:
      cols: 4
      rows: 3
      cells:
        # 3 列 × 3 行。「入力」で結果を PC に打ち込む
        "0,0": {widget: calculator, span: [3, 3]}
        # PC に貼り付けるときのキーなど
        "3,0": {key: LCTRL+C, label: コピー}
        "3,1": {key: TAB, label: Tab}
        "3,2": {layer_to: base, label: 基本}
  - name: graph
    label: グラフ
    touch:
      cols: 4
      rows: 3
      cells:
        # CPU の使用率。範囲を 0〜100 に決め、折れ線で描く
        "0,0": {widget: graph, id: cpu, label: CPU, unit: "%", min: 0, max: 100, span: [2, 1]}
        # メモリの使用率。棒で描く
        "2,0": {widget: graph, id: mem, label: メモリ, unit: "%", min: 0, max: 100, chart: bar, span: [2, 1]}
        # 温度。範囲は値から決める（min、max を書かない）。120 個を描き、2 分来なければ薄く出す
        "0,1": {widget: graph, id: temp, label: 温度, unit: ℃, points: 120, stale: 2m, span: [2, 2]}
        # 同じ id のセルは、同じ値を出す（小さなセルでは、値を大きく出し、下に小さく線を描く）
        "2,1": {widget: graph, id: cpu, label: CPU, unit: "%", min: 0, max: 100, points: 30}
        # グラフのセルはタップを使わないので、キーを送るようにもできる
        "3,1": {widget: graph, id: load, label: 負荷, decimals: 2, key: LGUI+SPACE}
        "2,2": {layer_to: menu, label: メニュー}
        "3,2": {layer_to: base, label: 基本}
  - name: mouse
    label: マウス
    touch:
      cols: 4
      rows: 5
      cells:
        # 左の 3 列ぶんがトラックパッド。右端の 96 ドットがスクロールの帯
        "0,0": {widget: trackpad, span: [3, 5], label: トラックパッド, speed: 1.2, accel: 2, scroll_width: 96, scroll_direction: natural}
        "3,0": {mouse: left, label: 左}
        "3,1": {mouse: right, label: 右}
        "3,2": {mouse: middle, label: 中}
        # USB をキーボードとマウスの形に切り替える（起動したときはブートキーボード）。USB を付け直すので 2〜3 秒切れる
        "3,3": {usb_mode: toggle}
        "3,4": {layer_to: base, label: 基本}
  - name: presen
    label: 発表
    touch:
      cols: 4
      rows: 3
      cells:
        # 持ち時間 20 分。色は既定（残り 5 分で黄、1 分で赤。過ぎたら赤で点滅）
        "0,0": {widget: presenter, id: talk, duration: 20m, label: 発表 20分, span: [2, 2]}
        # スライド送り。プレゼンター用のリモコンと同じく PageUp と PageDown を送る
        "2,0": {key: PAGEUP, label: 前へ, span: [1, 2]}
        "3,0": {key: PAGEDOWN, label: 次へ, span: [1, 2]}
        "0,2": {key: F5, label: "開始\n(F5)"}
        "1,2": {key: B, label: 黒い画面}
        "2,2": {key: ESC, label: 終了}
        "3,2": {layer_to: base, label: 基本}
    soft_keys:
      # 画面右の帯の ◀ ▶ でも、前後のスライドに移る
      left: LEFT
      right: RIGHT
  - name: memo
    label: メモ
    touch:
      cols: 4
      rows: 3
      cells:
        # メモはテキストのタイル。中身は PC から `brain-deck text memo "牛乳、電池"` で書き換える
        "0,0": {widget: text, id: memo, span: [4, 2], label: メモ}
        "0,2": {widget: todo, span: [3, 1], label: Todo}
        "3,2": {layer_to: base, label: 基本}
  - name: term
    label: 端末
    touch:
      cols: 2
      rows: 2
      cells:
        # Brain の画面とキーボードを、PC のコンソールの端末にする（README の「端末モード」。PC 側の設定が一度だけ要る）
        "0,0": {terminal: on, label: 端末に入る, span: [2, 1]}
        "0,1": {widget: text, id: build, label: ビルド}
        "1,1": {layer_to: base, label: 基本}
  - name: system
    label: 本体
    touch:
      cols: 4
      rows: 3
      cells:
        "0,0": {widget: battery, label: 電池}
        "1,0": {widget: clock, span: [2, 1]}
        "3,0": {widget: presence}
        # 画面の向き。next で 90 度ずつ回す。向きは保存され、再起動しても残る
        "0,1": {rotate: next, label: 回す}
        "1,1": {rotate: 0, label: 横向き}
        "2,1": {rotate: 90, label: 縦向き}
        "3,1": {rotate: 270, label: "縦向き\n(逆)"}
        # USB をキーボードとマウスの形に切り替える（USB を付け直すので 2〜3 秒切れる）
        "0,2": {usb_mode: toggle, span: [2, 1]}
        "2,2": {terminal: on, label: 端末}
        "3,2": {layer_to: base, label: 基本}
      # 縦向き（480x800）の格子。書かなければ、横向きの格子の列と行を入れ替えたもの（display.portrait_grid）
    touch_portrait:
      cols: 2
      rows: 5
      cells:
        "0,0": {widget: battery, label: 電池}
        "1,0": {widget: presence}
        "0,1": {widget: clock, span: [2, 1]}
        "0,2": {rotate: next, label: 回す}
        "1,2": {rotate: 0, label: 横向き}
        "0,3": {usb_mode: toggle}
        "1,3": {terminal: on, label: 端末}
        "0,4": {layer_to: base, label: 基本, span: [2, 1]}
# ホーム画面。アプリは、入る先のレイヤー（layer）と、名前（name）、アイコン（icon。組み込みの名前か、画像の id）。
# 1 ページは横向きで 4×3、縦向きで 3×4。入りきらなければ、下の ◀ ▶（と画面右の帯の ◀ ▶）でページを送る
home:
  label: はじめ
  background: 7f8f231d4a49bfee
  apps:
    - {name: 夕日の写真のアイコン, icon: 11af1a4e111547aa, layer: calendar}
    - {name: ないアイコン, icon: 0123456789abcdef, layer: todo}
    - {name: 左手, icon: keyboard, layer: base}
    - {name: 端末, icon: terminal, layer: term}
    - {name: Todo, layer: todo}
status_bar:
  show: true
  items: [battery, time]
# 自動減光。1 分触らなければ暗くし（明るさ 1）、5 分で消す。暗いときのタッチは、明るくするだけでセルを押さない。
# 本体キーは、暗いときもそのまま PC に送り、画面も明るくする（wake_on_key）。端末モードのあいだは暗くしない
backlight:
  dim_after: 1m
  dim_level: 1
  off_after: 5m
  wake_on_key: true
  in_terminal: false
display:
  portrait_grid: stretch
  enabled: true
  device: /dev/fb0

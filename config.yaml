# /etc/lefthand/config.yaml
hid_device: /dev/hidg0

# パス(/dev/input/eventN)かデバイス名のどちらでも指定できる。
# event 番号は起動順で変わることがあるので、デバイス名を推奨
keyboard: brain-kbd-i2c

# Brain側のキー(Linuxのキー名) : PCに送るキー
keys:
  KEY_A: LCTRL+Z
  KEY_S: LCTRL+LSHIFT+Z
  KEY_D: LCTRL+S
  KEY_SPACE: LSHIFT
  KEY_Q: B
  KEY_W: E

touch:
  device: mxs-lradc-ts
  cols: 4
  rows: 3
  # lefthand -calibrate で四隅を触って得た値を入れる（min>maxで反転）
  # swap_xy: true でパネルのX/Yを入れ替える
  # 2026-10-03 キャリブレーション（爪で画面の端ぎりぎりの四隅を押した値）
  #   左上 229,3834 / 右上 3990,3773 / 右下 3886,352 / 左下 224,416
  #   中央 2191,2222 も計算上の中心とほぼ一致（線形でずれなし）
  # 指の腹で角を押した値（min_x 311 など）だと、セルの境目が内側に寄る
  # Y は上下が逆なので min_y > max_y
  swap_xy: false
  min_x: 226
  max_x: 3938
  min_y: 3803
  max_y: 384
  cells:
    "0,0": B
    "1,0": E
    "2,0": LCTRL+Z
    "3,0": LCTRL+LSHIFT+Z
    "0,1": LEFTBRACE
    "1,1": RIGHTBRACE
    "3,2": SPACE
